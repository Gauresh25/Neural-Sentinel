repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7          # pin to the ruff version we installed
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1            # pin to the black version we installed
    hooks:
      - id: black
